<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="topFace" x1="28" y1="8" x2="52" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="16" y1="20" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="40" y1="20" x2="64" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>
  <!-- Cube icon -->
  <g transform="translate(8, 6) scale(0.32)">
    <polygon points="100,20 160,55 100,90 40,55" fill="url(#topFace)"/>
    <polygon points="40,55 100,90 100,155 40,120" fill="url(#leftFace)"/>
    <polygon points="160,55 100,90 100,155 160,120" fill="url(#rightFace)"/>
    <polygon points="100,20 160,55 100,90 40,55" fill="none" stroke="#E65100" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="40,55 100,90 100,155 40,120" fill="none" stroke="#E65100" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="160,55 100,90 100,155 160,120" fill="none" stroke="#E65100" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- "yellow" text -->
  <text x="72" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#1e293b" letter-spacing="-1">yellow</text>
  <!-- Subtitle line -->
  <line x1="72" y1="60" x2="310" y2="60" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="72" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#94a3b8" letter-spacing="2">DISEÑO DE PÁGINAS WEB Y ERP</text>
</svg>

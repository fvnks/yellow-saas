services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fvnkscl/yellow-saas:main
    container_name: yellow-saas-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yellow-saas.rule=Host(`x14fwmtnzpw9cur43gs3wwx1.148.113.196.87.sslip.io`)"
      - "traefik.http.routers.yellow-saas.entrypoints=https"
      - "traefik.http.routers.yellow-saas.tls=true"
      - "traefik.http.routers.yellow-saas.tls.certresolver=letsencrypt"
      - "traefik.http.services.yellow-saas.loadbalancer.server.port=3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@${DB_HOST}:5432/postgres"
      DATABASE_SSL: "false"
      JWT_SECRET: "${JWT_SECRET}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL}"

networks:
  coolify:
    external: true
    name: coolify